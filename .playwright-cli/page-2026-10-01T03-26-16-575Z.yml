        - heading "👋 About Me" [level=1] [ref=e59]
        - paragraph [ref=e60]:
          - text: Hello! My name is Xuyan Ye. I am a fourth-year undergraduate student majoring in AI at the
          - strong [ref=e61]: Gaoling School of Artificial Intelligence, Renmin University of China
          - text: ", advised by"
          - strong [ref=e62]:
            - link "Prof. Yankai Lin" [ref=e63] [cursor=pointer]:
              - /url: https://linyankai.github.io/
          - text: at
          - strong [ref=e64]: RUCBM
          - text: . I am currently an LLM Research Intern at
          - strong [ref=e65]: Ant Group
          - text: ", advised by"
          - strong [ref=e66]:
            - link "Wei Wu" [ref=e67] [cursor=pointer]:
              - /url: https://sites.google.com/view/wei-wu-homepage/home
          - text: ", working on Agentic RL and LLM Reasoning."
        - paragraph [ref=e68]:
          - text: I have also collaborated with
          - strong [ref=e69]:
            - link "Prof. Jiaxuan You" [ref=e70] [cursor=pointer]:
              - /url: https://cs.stanford.edu/people/jiaxuan/
          - text: and
          - strong [ref=e71]:
            - link "Prof. Heng Ji" [ref=e72] [cursor=pointer]:
              - /url: https://blender.cs.illinois.edu/hengji.html
          - text: at
          - strong [ref=e73]:
            - link "UIUC" [ref=e74] [cursor=pointer]:
              - /url: https://illinois.edu/
          - text: . Previously, I spent a wonderful summer at
          - strong [ref=e75]:
            - link "BREATHE-AI" [ref=e76] [cursor=pointer]:
              - /url: https://breathelab.ai/
          - text: ","
          - strong [ref=e77]: Nanyang Technological University
          - text: ", Singapore, conducting research under the guidance of"
          - strong [ref=e78]:
            - link "Prof. Wei Lu" [ref=e79] [cursor=pointer]:
              - /url: https://dr.ntu.edu.sg/entities/person/Wei-Lu
          - text: .
        - paragraph [ref=e80]:
          - text: My research interests include
          - strong [ref=e81]: LLM Reasoning, Fine-Grained Agent Evaluation, and Process Supervision in Agentic RL
          - text: .
        - paragraph [ref=e83]:
          - strong [ref=e84]: I am actively seeking CS/AI PhD positions for Fall 2027 entry.
          - text: If you are interested in my research experience, I would be very happy to connect. Feel free to reach out at
          - link "xuyan923r@gmail.com" [ref=e85] [cursor=pointer]:
            - /url: mailto:xuyan923r@gmail.com
          - text: .
