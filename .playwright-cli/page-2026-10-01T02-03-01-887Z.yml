        - paragraph [ref=e58]:
          - text: Hi!👋 My name is Xuyan Ye. I am a fourth-year undergraduate student majoring in AI at the
          - strong [ref=e59]: Gaoling School of Artificial Intelligence, Renmin University of China
          - text: . I am advised by
          - strong [ref=e60]:
            - link "Prof. Yankai Lin" [ref=e61] [cursor=pointer]:
              - /url: https://linyankai.github.io/
          - text: . My research interests include
          - strong [ref=e62]: LLM Reasoning, Fine-Grained Agent Evaluation, and Process Supervision in Agentic RL
          - text: .
        - paragraph [ref=e64]:
          - strong [ref=e65]: I am actively seeking CS/AI PhD positions for Fall 2027 entry.
