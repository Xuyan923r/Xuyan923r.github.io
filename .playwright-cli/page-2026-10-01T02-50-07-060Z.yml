        - heading "👋 About Me" [level=1] [ref=e57]
        - paragraph [ref=e58]:
          - text: Hello! My name is Xuyan Ye. I am a fourth-year undergraduate student majoring in AI at the
          - strong [ref=e59]: Gaoling School of Artificial Intelligence, Renmin University of China
          - text: ", advised by"
          - strong [ref=e60]:
            - link "Prof. Yankai Lin" [ref=e61] [cursor=pointer]:
              - /url: https://linyankai.github.io/
          - text: at
          - strong [ref=e62]: RUCBM
          - text: . I am currently an LLM Research Intern at
          - strong [ref=e63]: Ant Group
          - text: ", advised by"
          - strong [ref=e64]:
            - link "Wei Wu" [ref=e65] [cursor=pointer]:
              - /url: https://sites.google.com/view/wei-wu-homepage/home
          - text: ", working on Agentic RL and LLM Reasoning."
        - paragraph [ref=e66]:
          - text: I have also collaborated with
          - strong [ref=e67]:
            - link "Prof. Jiaxuan You" [ref=e68] [cursor=pointer]:
              - /url: https://cs.stanford.edu/people/jiaxuan/
          - text: and
          - strong [ref=e69]:
            - link "Prof. Heng Ji" [ref=e70] [cursor=pointer]:
              - /url: https://blender.cs.illinois.edu/hengji.html
          - text: at
          - strong [ref=e71]:
            - link "UIUC" [ref=e72] [cursor=pointer]:
              - /url: https://illinois.edu/
          - text: . Previously, I spent a wonderful summer at
          - strong [ref=e73]:
            - link "BREATHE-AI" [ref=e74] [cursor=pointer]:
              - /url: https://breathelab.ai/
          - text: ","
          - strong [ref=e75]: Nanyang Technological University
          - text: ", Singapore, conducting research under the guidance of"
          - strong [ref=e76]:
            - link "Prof. Wei Lu" [ref=e77] [cursor=pointer]:
              - /url: https://dr.ntu.edu.sg/entities/person/Wei-Lu
          - text: .
        - paragraph [ref=e78]:
          - text: My research interests include
          - strong [ref=e79]: LLM Reasoning, Fine-Grained Agent Evaluation, and Process Supervision in Agentic RL
          - text: .
        - paragraph [ref=e81]:
          - strong [ref=e82]: I am actively seeking CS/AI PhD positions for Fall 2027 entry.
          - text: If you are interested in my research experience, I would be very happy to connect. Feel free to reach out at
          - link "xuyan923r@gmail.com" [ref=e83] [cursor=pointer]:
            - /url: mailto:xuyan923r@gmail.com
          - text: .
