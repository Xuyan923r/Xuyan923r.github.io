        - heading "👋 About Me" [level=1] [ref=f1e53]
        - paragraph [ref=f1e54]:
          - text: Hi!👋 My name is Xuyan Ye. I am a fourth-year undergraduate student majoring in AI at the
          - strong [ref=f1e55]: Gaoling School of Artificial Intelligence, Renmin University of China
          - text: . I am advised by
          - strong [ref=f1e56]:
            - link "Prof. Yankai Lin" [ref=f1e57] [cursor=pointer]:
              - /url: https://linyankai.github.io/
          - text: . My research interests include
          - strong [ref=f1e58]: LLM Reasoning, Fine-Grained Agent Evaluation, and Process Supervison in Agentic RL
          - text: .
        - paragraph [ref=f1e60]:
          - strong [ref=f1e61]: I am actively seeking CS/AI PhD positions for Fall 2027 entry.
          - text: If you are interested in my research experience, I would be very happy to connect. Feel free to reach out at
          - link "xuyan923r@gmail.com" [ref=f1e62] [cursor=pointer]:
            - /url: mailto:xuyan923r@gmail.com
          - text: .
