        - heading "👋 About Me" [level=1] [ref=e53]
        - paragraph [ref=e54]:
          - text: Hi!👋 My name is Xuyan Ye. I am a fourth-year undergraduate student majoring in AI at the
          - strong [ref=e55]: Gaoling School of Artificial Intelligence, Renmin University of China
          - text: . I am advised by
          - strong [ref=e56]:
            - link "Prof. Yankai Lin" [ref=e57] [cursor=pointer]:
              - /url: https://linyankai.github.io/
          - text: . My research interests include
          - strong [ref=e58]: LLM Reasoning, Self-Evolving Agents, and Agentic RL
          - text: . ‼️
          - strong [ref=e59]: I am actively seeking a CS/AI PhD positions for Fall 2027 entry. If you are interested in my research experience, I would be very happy to connect.
